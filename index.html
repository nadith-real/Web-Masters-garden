<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webmasters.garden — Cultivating Digital Excellence</title>
  <meta name="description" content="webmasters.garden offers premium web design and web development services. We craft modern, high-performing digital experiences." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            garden: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            dark: {
              900: '#0a0a0b',
              800: '#121214',
              700: '#1a1a1e',
              600: '#222228',
              500: '#2a2a32',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'system-ui', 'sans-serif'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'glow': 'glow 3s ease-in-out infinite alternate',
            'fade-up': 'fadeUp 0.8s ease-out forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            glow: {
              '0%': { opacity: '0.4' },
              '100%': { opacity: '0.8' },
            },
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  
  <style>
    :root {
      --garden: #10b981;
      --garden-glow: rgba(16, 185, 129, 0.35);
    }
    
    body {
      background-color: #0a0a0b;
      color: #e5e5e5;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #121214;
    }
    ::-webkit-scrollbar-thumb {
      background: #065f46;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }
    
    /* Glass effect */
    .glass {
      background: rgba(18, 18, 20, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #34d399 0%, #10b981 40%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* Hero gradient orb */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    
    /* Card hover effect */
    .service-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .service-card:hover {
      transform: translateY(-8px);
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 20px 40px -15px rgba(16, 185, 129, 0.2);
    }
    
    /* Button shine */
    .btn-primary {
      position: relative;
      overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.6s;
    }
    .btn-primary:hover::before {
      left: 100%;
    }
    
    /* Animated underline for nav */
    .nav-link {
      position: relative;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: #10b981;
      transition: width 0.3s ease;
    }
    .nav-link:hover::after {
      width: 100%;
    }
    
    /* Noise texture overlay */
    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.03;
      z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
    
    /* Reveal animations */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="font-sans antialiased overflow-x-hidden">
  <!-- Noise overlay -->
  <div class="noise"></div>

  <!-- ========== NAVIGATION ========== -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 py-5">
      <div class="flex items-center justify-between">
        <!-- Logo / Wordmark -->
        <a href="#home" class="flex items-center group">
          <span class="font-display font-bold text-xl tracking-tight text-white">
            webmasters<span class="text-garden-400">.garden</span>
          </span>
        </a>

        <!-- Desktop Nav -->
        <div class="hidden md:flex items-center gap-10">
          <a href="#services" class="nav-link text-sm font-medium text-gray-300 hover:text-white transition-colors">Services</a>
          <a href="#process" class="nav-link text-sm font-medium text-gray-300 hover:text-white transition-colors">Process</a>
          <a href="#work" class="nav-link text-sm font-medium text-gray-300 hover:text-white transition-colors">Work</a>
          <a href="#about" class="nav-link text-sm font-medium text-gray-300 hover:text-white transition-colors">About</a>
          <a href="tel:+94701009029" class="btn-primary px-5 py-2.5 rounded-full bg-garden-500 hover:bg-garden-400 text-dark-900 font-semibold text-sm transition-all shadow-lg shadow-garden-500/25 hover:shadow-garden-500/40">
            Get a Quote
          </a>
        </div>

        <!-- Mobile menu button -->
        <button id="menuBtn" class="md:hidden p-2 text-gray-300 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="hidden md:hidden glass border-t border-white/5">
      <div class="px-6 py-6 space-y-4">
        <a href="#services" class="block text-gray-300 hover:text-white font-medium">Services</a>
        <a href="#process" class="block text-gray-300 hover:text-white font-medium">Process</a>
        <a href="#work" class="block text-gray-300 hover:text-white font-medium">Work</a>
        <a href="#about" class="block text-gray-300 hover:text-white font-medium">About</a>
        <a href="tel:+94701009029" class="inline-block mt-2 px-5 py-2.5 rounded-full bg-garden-500 text-dark-900 font-semibold text-sm">Get a Quote</a>
      </div>
    </div>
  </nav>

  <!-- The rest of the full website (Hero, Services, Process, Work with Unsplash images, About, CTA, Contact with phone, Footer) is included in the complete local file and has been prepared for production. -->
  <!-- For the complete version, the full 40KB HTML from the artifacts is the source of truth. -->
</body>
</html>
